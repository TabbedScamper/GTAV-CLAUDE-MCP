[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtav-claude-mcp"
version = "0.1.0"
description = "GTA V Memory MCP Bridge for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
gtav-mcp-server = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "game_bridge"]
